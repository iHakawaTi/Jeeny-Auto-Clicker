name: jeeny_auto_clicker
description: "Jeeny Auto-Clicker — Android accessibility-driven auto-accept for Jeeny rideshare drivers. Flutter UI, Supabase backend, subscription-gated."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Supabase auth + database
  supabase_flutter: ^2.5.0

  # Hardware device id + OS details
  device_info_plus: ^10.1.0

  # Local settings + language persistence
  shared_preferences: ^2.2.3

  # UI
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  flutter_spinkit: ^5.2.1

  # WhatsApp deep-link + settings intent launches from Dart
  url_launcher: ^6.3.0

  # Date/number formatting + i18n runtime helper
  intl: ^0.20.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/keemo_logo.jpg

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/keemo_logo.jpg"
  # Adaptive icon: dark background matches the new neon-purple logo canvas
  adaptive_icon_background: "#0D0D14"
  adaptive_icon_foreground: "assets/keemo_logo.jpg"
  remove_alpha_ios: true
  min_sdk_android: 21
